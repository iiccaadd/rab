<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Sistem Autentikasi</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo" style="background: linear-gradient(135deg, var(--amber-500), var(--amber-600));">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        </div>
        <h1 class="auth-title">Lupa Password?</h1>
        <p class="auth-subtitle">Masukkan alamat email Anda untuk menerima tautan pemulihan password</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="formForgotPassword">
        <div class="form-group">
          <label class="form-label" for="email">Alamat Email Terdaftar</label>
          <input type="email" id="email" class="form-input" placeholder="nama@domain.com" required autocomplete="email">
        </div>

        <button type="submit" id="btnForgot" class="btn btn-primary">
          <span class="btn-text">Kirim Tautan Reset Password</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Ingat password Anda? <a href="login.html" class="link">Kembali ke Login</a>
      </div>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
