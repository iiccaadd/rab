<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Sistem Autentikasi</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo" style="background: linear-gradient(135deg, var(--rose-500), var(--rose-600));">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
        </div>
        <h1 class="auth-title">Atur Ulang Password</h1>
        <p class="auth-subtitle">Masukkan password baru yang kuat untuk akun Anda</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="formResetPassword">
        <div class="form-group">
          <label class="form-label" for="newPassword">Password Baru</label>
          <input type="password" id="newPassword" class="form-input" placeholder="Minimal 8 karakter (A-Z, a-z, 0-9)" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Konfirmasi Password Baru</label>
          <input type="password" id="confirmNewPassword" class="form-input" placeholder="Ulangi password baru Anda" required autocomplete="new-password">
        </div>

        <button type="submit" id="btnReset" class="btn btn-primary">
          <span class="btn-text">Simpan Password Baru</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="link">Kembali ke Login</a>
      </div>
    </div>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
