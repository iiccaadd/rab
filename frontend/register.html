<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru - Sistem Autentikasi</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        </div>
        <h1 class="auth-title">Buat Akun Baru</h1>
        <p class="auth-subtitle">Daftarkan akun Anda untuk akses penuh sistem</p>
      </div>

      <div id="alertBox" class="alert" style="display: none;"></div>

      <form id="formRegister" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Nama Lengkap</label>
          <input type="text" id="name" class="form-input" placeholder="Budi Santoso" required autocomplete="name">
          <div id="nameFeedback" class="input-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Alamat Email</label>
          <input type="email" id="email" class="form-input" placeholder="budi@example.com" required autocomplete="email">
          <div id="emailFeedback" class="input-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Minimal 8 karakter (A-Z, a-z, 0-9)" required autocomplete="new-password">
          <div class="strength-meter">
            <div class="strength-bars">
              <div class="strength-bar" id="bar1"></div>
              <div class="strength-bar" id="bar2"></div>
              <div class="strength-bar" id="bar3"></div>
              <div class="strength-bar" id="bar4"></div>
            </div>
            <div class="strength-text" id="strengthText">Kekuatan password: Terlalu pendek</div>
          </div>
          <div id="passwordFeedback" class="input-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Ulangi password Anda" required autocomplete="new-password">
          <div id="confirmPasswordFeedback" class="input-feedback"></div>
        </div>

        <button type="submit" id="btnRegister" class="btn btn-primary" style="margin-top: 0.5rem;">
          <span class="btn-text">Daftar Akun</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html" class="link">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
